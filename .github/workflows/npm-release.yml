name: Release agentic-income packages

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify only, stage for npm approval, or publish after environment approval
        required: true
        default: verify
        type: choice
        options: [verify, stage, publish]

permissions:
  contents: read

concurrency:
  group: agentic-income-npm-production
  cancel-in-progress: false

env:
  # Dependency order: cli depends on the other three, redirect on catalog.
  PACKAGES: core catalog redirect cli

jobs:
  verify:
    if: github.repository == 'frankxai/agentic-income-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts
      - name: Build in dependency order
        run: for p in $PACKAGES; do npx tsc -p "packages/$p"; done
      - run: npm test
      - name: Pack the exact bytes that publication will use
        run: |
          mkdir -p artifacts/release
          for p in $PACKAGES; do
            (cd "packages/$p" && npm pack --ignore-scripts --pack-destination ../../artifacts/release --json) > "artifacts/release/$p.pack.json"
          done
          ls -l artifacts/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: income-release-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.operation == 'stage' || inputs.operation == 'publish'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: income-release-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/release/
          digest-mismatch: error
      - name: Submit verified bytes through npm OIDC (no token)
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            name=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1]))[0].name)' "artifacts/release/$p.pack.json")
            version=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1]))[0].version)' "artifacts/release/$p.pack.json")
            file=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1]))[0].filename)' "artifacts/release/$p.pack.json")
            # Refuse a tarball whose bytes differ from what npm pack recorded in the verify job.
            node -e '
              const fs = require("fs"), crypto = require("crypto");
              const [packJson, tgz] = process.argv.slice(1);
              const want = JSON.parse(fs.readFileSync(packJson))[0].integrity;
              const got = "sha512-" + crypto.createHash("sha512").update(fs.readFileSync(tgz)).digest("base64");
              if (got !== want) { console.error(`integrity mismatch for ${tgz}`); process.exit(1); }
            ' "artifacts/release/$p.pack.json" "artifacts/release/$file"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version: already on the registry"
              continue
            fi
            if [ "$OPERATION" = stage ]; then
              npm stage publish "artifacts/release/$file" --provenance --access public --ignore-scripts
            else
              npm publish "artifacts/release/$file" --provenance --access public --ignore-scripts
            fi
          done
