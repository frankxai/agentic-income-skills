name: CI

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Validate data/programs.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/programs.json'))"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate the reference income system
        run: npm run income:validate -- examples/request-to-quote-desk/income-system.json
